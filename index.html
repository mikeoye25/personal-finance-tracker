<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Personal Finance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600;700&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4F1; --surface:#FFFFFF; --surface-2:#F3F7F5; --ink:#2A2622; --ink-2:#6E675F; --ink-3:#9A938B; --line:#D7E1DC;
  --brand:#EA5F2E; --brand-ink:#FFFFFF; --teal:#17857A; --teal-soft:#DCF1EC;
  --over:#B3261E; --over-soft:#FBE9E7; --near:#8A5500; --near-soft:#FFF1D1; --ok:#1E7A46; --ok-soft:#E1F3E7;
  --toast-bg:#2A2622; --toast-fg:#F6F4EF; --toast-over:#FFB3AA; --toast-near:#FFD88A; --toast-ok:#9FE3B8; --toast-undo:#FFD9CB;
  --shadow:0 10px 30px rgba(42,38,34,.14);
  --nav-h:64px; --radius:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131C18; --surface:#1C2722; --surface-2:#223029; --ink:#F2EFE8; --ink-2:#B2BBB5; --ink-3:#7E8882; --line:#2F3E37;
    --brand:#FF7A4A; --brand-ink:#1A120D; --teal:#4CC4AE; --teal-soft:#1F3B36;
    --over:#FF8F86; --over-soft:#4A211D; --near:#F2C06B; --near-soft:#4A3712; --ok:#7FD6A1; --ok-soft:#173B29;
    --toast-bg:#F2EFE8; --toast-fg:#1C2722; --toast-over:#B3261E; --toast-near:#8A5500; --toast-ok:#1E7A46; --toast-undo:#C2461D;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131C18; --surface:#1C2722; --surface-2:#223029; --ink:#F2EFE8; --ink-2:#B2BBB5; --ink-3:#7E8882; --line:#2F3E37;
  --brand:#FF7A4A; --brand-ink:#1A120D; --teal:#4CC4AE; --teal-soft:#1F3B36;
  --over:#FF8F86; --over-soft:#4A211D; --near:#F2C06B; --near-soft:#4A3712; --ok:#7FD6A1; --ok-soft:#173B29;
  --toast-bg:#F2EFE8; --toast-fg:#1C2722; --toast-over:#B3261E; --toast-near:#8A5500; --toast-ok:#1E7A46; --toast-undo:#C2461D;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fira Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body.noscroll{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3,.big{font-family:'Fira Sans Condensed','Fira Sans',system-ui,sans-serif;font-weight:700;letter-spacing:-.01em}
h1{font-size:26px;margin:0;line-height:1.15}
h2{font-size:20px;margin:24px 0 8px}
h3{font-size:16px;margin:16px 0 8px;color:var(--ink-2);font-weight:600}
p{margin:0 0 12px}
main{padding:12px 16px calc(var(--nav-h) + 112px);max-width:560px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 6px}
.brand{font-family:'Fira Sans Condensed','Fira Sans',sans-serif;font-weight:700;font-size:18px;color:var(--ink-2)}
.monthbar{display:flex;align-items:center;gap:4px;margin:4px 0 12px}
.monthbar h1{flex:1;text-align:center}
.iconbtn{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:0 0 auto}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.summary{background:var(--surface);border-radius:var(--radius);padding:20px 18px 16px;box-shadow:var(--shadow);margin-bottom:8px}
.big{font-size:44px;line-height:1;color:var(--ok)}
.summary.is-over .big{color:var(--over)}
.biglabel{color:var(--ink-2);margin:4px 0 14px}
.bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar span{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .4s ease}
.summary.is-over .bar span{background:var(--over)}
.caption{margin-top:10px;color:var(--ink-2);font-size:14px}
.caption b{font-weight:500;color:var(--ink)}
.list{display:flex;flex-direction:column;gap:6px}
.catrow,.exprow{width:100%;display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:56px}
.catrow:active,.exprow:active{background:var(--surface-2)}
.ci{font-size:22px;text-align:center;line-height:1}
.cn{min-width:0;display:flex;flex-direction:column}
.cn .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn .sub{font-size:13px;color:var(--ink-2)}
.minibar{display:block;height:4px;border-radius:99px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--ok)}
.catrow.over .minibar i{background:var(--over)}
.catrow.near .minibar i{background:var(--near)}
.cs{font-weight:600;white-space:nowrap;font-size:15px}
.catrow.over .cs{color:var(--over)}
.catrow.near .cs{color:var(--near)}
.catrow.ok .cs{color:var(--ok)}
.quiet{color:var(--ink-2)}
.small{font-size:13px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:24px 18px;text-align:center}
.empty h2{margin-top:0}
.empty p{color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;font-weight:600;border:1px solid transparent}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.primary:active{filter:brightness(.95)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.danger{color:var(--over);background:var(--over-soft)}
.btn.block{width:100%}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .navbrand{display:none}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:var(--ink-3)}
.nav button.on{color:var(--teal)}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);width:60px;height:60px;border-radius:999px;background:var(--brand);color:var(--brand-ink);box-shadow:0 8px 24px rgba(234,95,46,.4);display:flex;align-items:center;justify-content:center;z-index:21}
.fab svg{width:28px;height:28px}
.fab.hidden{display:none}
.filter{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:4px 6px 4px 12px;font-weight:500;margin-bottom:8px}
.chip-x{width:28px;height:28px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center}
.chip-x svg{width:16px;height:16px}
.exptotal{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 4px;color:var(--ink-2)}
.exptotal strong{color:var(--ink);font-size:18px;font-family:'Fira Sans Condensed','Fira Sans',sans-serif}
.day{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);margin:18px 2px 6px}
.day span{font-weight:500}
.swipe{position:relative;overflow:hidden;border-radius:12px;margin-bottom:6px}
.swipe-action{position:absolute;top:0;bottom:0;right:0;width:88px;background:var(--over);color:#fff;font-weight:600;border-radius:0 12px 12px 0}
.swipe-body{position:relative;transition:transform .2s ease;will-change:transform}
.swipe.dragging .swipe-body{transition:none}
.exprow .amt{font-weight:600;white-space:nowrap}
.pos{color:var(--ok)}
.summary.is-neutral .big{color:var(--ink)}
.summary .btn{margin-top:14px}
.vs-income{font-size:13px;color:var(--ink-2);margin:0 2px}
.vs-income.over{color:var(--over)}
.option{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:10px;display:flex;flex-direction:column;gap:2px}
.option strong{font-size:17px}
.option span{color:var(--ink-2);font-size:14px}
.option:active{border-color:var(--teal)}
.editor{display:flex;flex-direction:column;gap:8px}
.brow{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 4px}
.brow.dragging{box-shadow:var(--shadow);opacity:.92;z-index:2}
.handle{touch-action:none;cursor:grab;color:var(--ink-3);display:flex;align-items:center;justify-content:center;width:22px;height:36px;flex:0 0 auto}
.handle svg{width:18px;height:18px}
.brow .ci{font-size:19px;flex:0 0 auto;width:24px;text-align:center}
.brow input{border:0;background:transparent;padding:6px;border-radius:8px;min-width:0;height:36px}
.brow input:focus{background:var(--surface-2);outline:2px solid var(--teal)}
.brow .name{font-weight:500;flex:1;width:auto}
.brow .remove{width:32px;height:32px;border-radius:999px;color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.brow .remove svg{width:16px;height:16px}
.amtwrap{flex:0 0 auto;display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:10px;padding:0 6px;width:108px}
.amtwrap .sym{color:var(--ink-2);font-size:14px}
.amtwrap input{text-align:right;font-weight:600;font-size:15px;background:transparent;width:100%}
.addrow{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;color:var(--teal);font-weight:600;padding:12px 4px;margin-bottom:12px}
.addrow svg{width:20px;height:20px}
.quick .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600;color:var(--ink-2);font-size:14px}
.quick .qrow{display:flex;gap:8px;align-items:center}
.quick .qrow-new{margin-bottom:8px}
.quick select.catselect{margin-bottom:8px}
.quick input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);min-width:0;outline:none;min-height:44px}
.quick input:focus{border-color:var(--teal)}
.quick .qname{flex:1}
.quick .qamt{width:112px;text-align:right;font-weight:600}
.quick .btn{min-height:44px;padding:0 14px;flex:0 0 auto}
.quick .qhint{color:var(--ink-2);font-size:13px;margin:8px 0 0}
.editor:empty+.editfoot{margin-top:0}
.editfoot{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 16px;margin-top:12px;box-shadow:var(--shadow)}
.editfoot-row{display:flex;align-items:center;gap:12px}
.unsaved-note{font-size:13px;color:var(--near);margin:0 2px}
.unsaved-note:empty{display:none}
.unsaved-note strong{font-weight:600}
.editfoot .total{flex:1;line-height:1.2}
.editfoot .total small{display:block;color:var(--ink-2);font-size:13px}
.editfoot .total strong{font-size:20px;font-family:'Fira Sans Condensed','Fira Sans',sans-serif}
.editfoot .link{color:var(--ink-2);font-size:14px;text-decoration:underline;padding:8px 4px}
.backdrop{position:fixed;inset:0;background:rgba(20,30,26,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sh-head h2{margin:8px 0;font-size:20px}
.amount{display:flex;align-items:baseline;gap:6px;padding:8px 4px 4px;border-bottom:2px solid var(--line);margin-bottom:14px}
.top-actions{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.amount:focus-within{border-color:var(--teal)}
.amount .sym{font-size:28px;color:var(--ink-2);font-family:'Fira Sans Condensed','Fira Sans',sans-serif;font-weight:600}
.amount input{flex:1;border:0;background:transparent;font-family:'Fira Sans Condensed','Fira Sans',sans-serif;font-weight:700;font-size:44px;line-height:1.1;padding:0;min-width:0;outline:none}
.amount input::placeholder{color:var(--ink-3)}
.chips{display:block}
.chips .hint,.hint{color:var(--ink-2);font-size:14px;margin:0 0 12px}
.pagetitle{margin:8px 0 6px}
body.auth-mode .nav,body.auth-mode .fab,body.auth-mode main{display:none}
.auth{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px 40px}
.auth[hidden]{display:none}
.auth-card{width:100%;max-width:400px;background:var(--surface);border-radius:var(--radius);padding:24px 20px;box-shadow:var(--shadow)}
.auth-brand{font-family:'Fira Sans Condensed','Fira Sans',sans-serif;font-weight:700;color:var(--teal);font-size:18px;margin-bottom:6px}
.auth h1{font-size:28px;margin:0 0 4px}
.auth .lead{color:var(--ink-2);margin:0 0 16px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
.field input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);font-size:16px;outline:none}
.field input:focus{border-color:var(--teal)}
.showpw{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);margin:0 0 14px}
.showpw input{width:18px;height:18px;accent-color:var(--teal);margin:0}
.auth-links{display:flex;justify-content:space-between;gap:12px;margin:14px 0 18px}
.auth .link{color:var(--teal);font-weight:500;text-decoration:underline;padding:6px 0}
.auth-code{font-family:'Fira Sans Condensed','Fira Sans',sans-serif;font-size:32px;letter-spacing:.14em;background:var(--surface-2);border-radius:12px;padding:10px;text-align:center;margin:0 0 6px}
.auth .demo-note{font-size:13px;color:var(--ink-2);margin:10px 0 0}
.sheet .field input{background:var(--surface)}
.closecard{background:var(--surface);border:1.5px solid var(--near);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.closecard strong{display:block;font-size:16px;margin-bottom:4px}
.closecard.is-waiting{border-color:var(--line)}
.closecard p{color:var(--ink-2);font-size:14px;margin:0 0 10px}
.closecard .warn,.sheet .warn{color:var(--over);font-weight:500}
.closedbanner{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.closedbanner .lock{color:var(--ink-2);flex:0 0 auto;margin-top:2px}
.closedbanner .lock svg{width:20px;height:20px}
.closedbanner strong{display:block}
.closedbanner p{color:var(--ink-2);font-size:14px;margin:2px 0 0}
.closesum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
.closesum div{background:var(--surface-2);border-radius:12px;padding:10px}
.closesum span{display:block;font-size:13px;color:var(--ink-2)}
.closesum strong{font-size:16px}
.neg{color:var(--over)}
.exprow.static{cursor:default;margin-bottom:6px}
.dchip:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled{opacity:.5;cursor:not-allowed}
.brow.ro{padding:10px 12px}
.brow.ro .name{flex:1;font-weight:500}
.ro-amt{font-weight:600}
.ro-total{display:flex;justify-content:space-between;margin:10px 4px;color:var(--ink-2)}
.ro-total strong{color:var(--ink)}
.catselect{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);font-size:16px;margin-bottom:12px;color:var(--ink)}
.catselect:focus{border-color:var(--teal)}
.catselect:disabled{opacity:.6}
.catselect.over{border-color:var(--over)}
.catselect.near{border-color:var(--near)}
.dates{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.dchip{position:relative;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;min-height:40px}
.dchip.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.dchip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.desc{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);margin-bottom:12px;outline:none}
.desc:focus{border-color:var(--teal)}
.formhint{min-height:20px;color:var(--over);font-size:14px;margin:0 0 8px 2px}
.formhint.ok-msg{color:var(--ok)}
.actions{display:flex;flex-direction:column;gap:8px}
.radios{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.pctrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pctrow input{width:84px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:16px;font-weight:600;text-align:right}
.pctrow input:focus{border-color:var(--teal)}
.pctrow span{color:var(--ink-2);font-weight:500}
.radio{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.radio:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.radio input{width:20px;height:20px;accent-color:var(--teal);margin:0}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:60;background:var(--toast-bg);color:var(--toast-fg);border-radius:12px;padding:12px 14px;display:none;align-items:center;gap:12px;box-shadow:var(--shadow);font-weight:500}
.toast.show{display:flex}
.toast span{flex:1}
.toast button{color:var(--toast-undo);font-weight:700;padding:4px 6px}
.toast.over span{color:var(--toast-over)}
.toast.near span{color:var(--toast-near)}
.toast.ok span{color:var(--toast-ok)}
@media (min-width:840px){
  .nav{position:fixed;top:0;bottom:0;left:0;right:auto;width:220px;height:auto;flex-direction:column;justify-content:flex-start;gap:4px;padding:28px 14px;border-top:0;border-right:1px solid var(--line)}
  .nav .navbrand{display:block;font-family:'Fira Sans Condensed','Fira Sans',sans-serif;font-weight:700;font-size:20px;padding:0 14px 20px;color:var(--ink)}
  .nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;font-size:16px;padding:12px 14px;border-radius:12px}
  .nav button.on{background:var(--teal-soft)}
  main{margin-left:220px;max-width:720px;padding:40px 48px 120px}
  .topbar .brand{display:none}
  .fab{right:40px;bottom:40px}
  .editfoot{bottom:16px}
  .backdrop{align-items:center}
  .sheet{max-width:520px;border-radius:22px;padding-bottom:20px}
  .toast{left:auto;right:40px;bottom:112px;width:380px}
  .big{font-size:56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav" aria-label="Main">
    <div class="navbrand">Finance tracker</div>
    <button type="button" data-go="home" data-nav><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
    <button type="button" data-go="sources" data-nav><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.2c0-1 1.1-1.7 2.5-1.7s2.5.7 2.5 1.7-1.1 1.4-2.5 1.8-2.5.8-2.5 1.8 1.1 1.7 2.5 1.7 2.5-.7 2.5-1.7"/></svg>Sources</button>

const $ = (s, r = document) => r.querySelector(s);

function today() { return new Date(); }
function ymOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function isoOf(d) { return ymOf(d) + '-' + pad(d.getDate()); }

function addMonths(ym, n) { const [y, m] = ym.split('-').map(Number); return ymOf(new Date(y, m - 1 + n, 1)); }

function monthLabel(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleString('en', { month: 'short', year: 'numeric' }); }
function monthLong(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleString('en', { month: 'long', year: 'numeric' }); }
function parseISO(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
function dayLabel(iso) {

  if (iso === yesterdayISO()) return 'Yesterday';

}
function daysLeft(ym) {
  const c = ymOf(today());
  if (ym < c) return 0;
  if (ym > c) return daysInMonth(ym);
  return daysInMonth(ym) - today().getDate();
}
function iconFor(name) {

let state = null;

function sym() { return (CURRENCIES[state.settings.currency] || CURRENCIES.NGN).symbol; }

function fmt(minor) {
  const neg = minor < 0, abs = Math.abs(minor);
  const units = Math.floor(abs / 100), cents = abs % 100;
  let s = units.toLocaleString('en');
  if (cents) s += '.' + pad(cents);
  return (neg ? '−' : '') + sym() + s;
}
function fmtInput(minor) {
  const units = Math.floor(minor / 100), cents = minor % 100;
  let s = units.toLocaleString('en');
  if (cents) s += '.' + pad(cents);
  return s;
}
function parseAmount(str) {
  const clean = String(str || '').replace(/[^0-9.]/g, '');
  if (!clean) return 0;
  const n = Number(clean);
  return isFinite(n) ? Math.round(n * 100) : 0;
}
function liveFormat(input) {
  const raw = input.value.replace(/[^0-9.]/g, '');
  const parts = raw.split('.');
  const int = parts[0].replace(/^0+(?=\d)/, '');
  const dec = parts.length > 1 ? '.' + parts[1].slice(0, 2) : '';
  const f = int ? Number(int).toLocaleString('en') : '';
  input.value = f + dec;
}

function seedAll() { const s = seed(); s.income = seedIncome(s.sources); return s; }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const s = JSON.parse(raw); if (s && s.v === 1 && s.settings && s.categories && s.budgets && s.expenses) { migrate(s); return s; } }
  } catch (e) { /* storage unavailable: run in memory */ }

}
function emptyState() { return { v: 1, settings: { currency: 'NGN', nearPct: 80, closeDay: 15 }, closed: {}, categories: [], budgets: {}, expenses: [], sources: seedSources(), income: [] }; }
function migrate(s) {
  if (!Array.isArray(s.sources)) s.sources = seedSources();
  delete s.sourcePlans;
  if (!s.closed) s.closed = {};
  if (!s.settings.closeDay) s.settings.closeDay = 15;
  if (!Array.isArray(s.income)) s.income = seedIncome(s.sources);
  s.income.forEach(e => {
    if (e.srcId) return;
    const nm = e.source || 'Other';
    let src = s.sources.find(x => x.name.toLowerCase() === nm.toLowerCase());
    if (!src) { src = { id: uid(), name: nm, icon: srcIcon(nm), sort: s.sources.length, archived: false }; s.sources.push(src); }
    e.srcId = src.id; delete e.source;
  });
}
function save() { if (!KEY || !state) return; try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }

function seed() {
  const now = today(), cur = ymOf(now), prev = addMonths(cur, -1), td = now.getDate();
  const cats = STARTER.map((s, i) => ({ id: 'c' + (i + 1), name: s[0], icon: s[1], sort: i, archived: false }));
  const byName = n => cats.find(c => c.name === n).id;
  const lines = () => STARTER.map((s, i) => ({ catId: 'c' + (i + 1), amount: s[2] * 100 }));
  const ex = []; let n = 0;
  const add = (ym, day, desc, cat, amt, clamp) => {
    const d = Math.min(clamp ? Math.min(day, td) : day, daysInMonth(ym));
    ex.push({ id: 'd' + (++n), catId: byName(cat), date: ym + '-' + pad(d), amount: amt * 100, desc });
  };
  PREV_ROWS.forEach(r => add(prev, r[0], r[1], r[2], r[3], false));
  CUR_ROWS.forEach(r => add(cur, r[0], r[1], r[2], r[3], true));
  const budgets = {}; budgets[prev] = lines(); budgets[cur] = lines();
  return { v: 1, settings: { currency: 'NGN', nearPct: 80, closeDay: 15 }, closed: {}, categories: cats, budgets, expenses: ex, sources: seedSources(), income: null };
}
function seedSources() { return SRC_STARTER.map((s, i) => ({ id: 's' + (i + 1), name: s[0], icon: s[1], sort: i, archived: false })); }
function seedIncome(sources) {
  const now = today(), cur = ymOf(now), prev = addMonths(cur, -1), td = now.getDate(), out = []; let n = 0;
  const sid = nm => { const x = (sources || []).find(s => s.name === nm); return x ? x.id : null; };
  const add = (ym, r, clamp) => { const d = Math.min(clamp ? Math.min(r[0], td) : r[0], daysInMonth(ym)); out.push({ id: 'i' + (++n), date: ym + '-' + pad(d), amount: r[3] * 100, srcId: sid(r[2]), desc: r[1] }); };
  INC_PREV.forEach(r => add(prev, r, false));
  INC_CUR.forEach(r => add(cur, r, true));
  return out;
}

function catById(id) { return state.categories.find(c => c.id === id); }
function srcById(id) { return (state.sources || []).find(c => c.id === id); }
function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1); }
function expensesIn(ym) { return state.expenses.filter(e => e.date.startsWith(ym)); }
function incomeIn(ym) { return (state.income || []).filter(e => e.date.startsWith(ym)); }
function incomeTotal(ym) { return incomeIn(ym).reduce((s, e) => s + e.amount, 0); }
function monthStats(ym) {
  const lines = state.budgets[ym] || [];
  const ex = expensesIn(ym);
  const rows = lines.map(l => {
    const cat = catById(l.catId) || { id: l.catId, name: 'Unknown', icon: '🏷️', sort: 999 };
    const actual = ex.filter(e => e.catId === l.catId).reduce((s, e) => s + e.amount, 0);
    const left = l.amount - actual;
    const pct = l.amount > 0 ? actual / l.amount : (actual > 0 ? 2 : 0);
    let status, label;
    if (actual > l.amount) { status = 'over'; label = fmt(-left) + ' over'; }
    else if (l.amount > 0 && pct >= nearPct() / 100 && daysLeft(ym) > 0) { status = 'near'; label = left === 0 ? 'Fully used' : fmt(left) + ' left'; }
    else { status = 'ok'; label = left === 0 ? 'Fully used' : fmt(left) + ' left'; }
    return { cat, amount: l.amount, actual, left, pct, status, label };
  });
  const budget = lines.reduce((s, l) => s + l.amount, 0);
  const spent = ex.reduce((s, e) => s + e.amount, 0);
  return { rows, budget, spent, income: incomeTotal(ym), left: budget - spent, hasBudget: !!state.budgets[ym] };
}
const PLANS = {
  budget: { noun: 'category', nounPl: 'categories', total: 'Total budget', saveLabel: 'Save budget', savedMsg: ym => `${monthLabel(ym)} budget saved`, lastLabel: m => `Use ${monthLabel(m)}’s budget`, starterDesc: (n, t) => `${n} common categories with amounts filled in, ${t} in total`, emptyDesc: 'Add your own categories one by one', blurb: 'Start from something, then adjust the amounts. Most people finish in about a minute.', title: ym => `Set up ${monthLabel(ym)}` },
};
function P() {
  return Object.assign({ kind: 'budget', items: state.categories, plans: state.budgets, starter: STARTER, suggest: SUGGEST, icon: iconFor, byId: catById }, PLANS.budget);
}
function latestPlanBefore(plans, ym) { const months = Object.keys(plans).filter(m => m < ym).sort(); return months.length ? months[months.length - 1] : null; }
function lastAmountFor(name, p) {
  p = p || P();
  const n = name.trim().toLowerCase();
  const it = p.items.find(c => c.name.toLowerCase() === n);
  if (it) {
    const months = Object.keys(p.plans).sort().reverse();
    for (const m of months) { const l = p.plans[m].find(x => x.catId === it.id); if (l && l.amount > 0) return { amount: l.amount, known: true }; }
  }
  const st = p.starter.find(x => x[0].toLowerCase() === n);
  return { amount: st ? st[2] * 100 : 0, known: false };
}

/* ---------- month closing ---------- */
function closeDay() { const n = Number(state.settings.closeDay); return (n >= 1 && n <= 28) ? n : 15; }
function isClosed(ym) { return !!(state.closed && state.closed[ym]); }
function pastDeadline(ym) { return ym < ymOf(today()) && todayISO() >= deadlineISO(ym); }
function isLocked(ym) { return isClosed(ym) || pastDeadline(ym); }
function lockBannerHTML(ym) {
  if (isClosed(ym)) return closedBannerHTML(ym);
  if (!pastDeadline(ym)) return '';
  return `<section class="closedbanner"><span class="lock">${ICON.lock}</span><div><strong>${monthLong(ym)} is closed</strong><p>It passed its closing day on ${dateNice(deadlineISO(ym))}, so it can\u2019t be changed.</p></div></section>`;
}
function lastClosedMonth() { const k = Object.keys(state.closed || {}).sort(); return k.length ? k[k.length - 1] : null; }
function earliestMonth() {
  const ms = Object.keys(state.budgets).concat(state.expenses.map(e => e.date.slice(0, 7)), (state.income || []).map(e => e.date.slice(0, 7)), Object.keys(state.closed || {}));
  return ms.length ? ms.sort()[0] : null;
}
function deadlineISO(ym) { const n = addMonths(ym, 1); return n + '-' + pad(Math.min(closeDay(), daysInMonth(n))); }
function dateNice(iso) { return parseISO(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
function closeBlocker(ym) {
  if (isClosed(ym)) return 'closed';
  if (ym >= ymOf(today())) return 'notEnded';
  const first = earliestMonth();
  if (!first || ym < first) return 'empty';
  if (ym > first && !isClosed(addMonths(ym, -1))) return 'prevOpen';
  return '';
}
function pendingCloseMonth() { const cur = ymOf(today()); let m = earliestMonth(); while (m && m < cur) { if (!isClosed(m)) return m; m = addMonths(m, 1); } return null; }
function carrySource() {
  let x = state.sources.find(z => z.id === 'carry');
  if (!x) { x = { id: 'carry', name: 'Carried over', icon: '\u21aa\ufe0f', sort: 999, archived: false, system: true }; state.sources.push(x); }
  return x;
}
function closeMonth(ym, auto) {
  if (closeBlocker(ym)) return false;
  const st = monthStats(ym), x = st.income, y = st.budget, z = st.spent, carry = x - z, next = addMonths(ym, 1);
  if (carry !== 0) {
    state.income.push({ id: uid(), date: next + '-01', amount: carry, srcId: carrySource().id, carry: ym,
      desc: carry > 0 ? `Savings carried from last month (${monthLong(ym)})` : `Debt carried from last month (${monthLong(ym)})` });
  }

}
function carryText(ym, carry) {
  const nx = monthLong(addMonths(ym, 1));
  return carry > 0 ? `${fmt(carry)} carried to ${nx} as savings.` : carry < 0 ? `${fmt(-carry)} of debt carried to ${nx}.` : 'Nothing was left over, so nothing was carried.';
}
function runAutoClose() {
  const cur = ymOf(today()), t = todayISO(), done = [];

    m = addMonths(m, 1);
  }
  if (done.length) {
    const last = done[done.length - 1];
    toast(done.length === 1 ? `${monthLong(last)} closed automatically. ${carryText(last, state.closed[last].carry)}` : `${done.length} months closed automatically, up to ${monthLong(last)}.`, { status: 'ok', long: true });
  }
  return done;
}
function closedBannerHTML(ym) {
  const c = state.closed[ym]; if (!c) return '';
  const over = c.budget > 0 && c.spent > c.budget ? ` Spending exceeded the ${fmt(c.budget)} budget by ${fmt(c.spent - c.budget)}.` : '';
  return `<section class="closedbanner"><span class="lock">${ICON.lock}</span><div><strong>${monthLong(ym)} is closed</strong><p>Closed ${c.auto ? 'automatically ' : ''}on ${dateNice(c.at)}. ${carryText(ym, c.carry)}${over} Its budget, expenses and income can\u2019t be changed.</p></div></section>`;
}

<div class="closesum"><div><span>Income</span><strong>${fmt(x)}</strong></div><div><span>Budget</span><strong>${fmt(y)}</strong></div><div><span>Spent</span><strong>${fmt(z)}</strong></div></div>
<p>${outcome}</p>${over}
<p class="quiet small">After closing, ${mm}\u2019s budget, expenses and income can\u2019t be changed.</p>

function sfmt(a) { return a < 0 ? fmt(a) : '+' + fmt(a); }

/* ---------- rendering ---------- */

function monthBar() {
  return `<div class="monthbar"><button type="button" class="iconbtn" data-m="-1" aria-label="Previous month">${ICON.left}</button><h1>${monthLong(ui.month)}</h1><button type="button" class="iconbtn" data-m="1" aria-label="Next month">${ICON.right}</button></div>`;
}
function catRow(r) {

}
function renderHome() {
  const ym = ui.month, st = monthStats(ym);

  h += locked ? lockBannerHTML(ym) : (ym < ymOf(today()) ? closeCardHTML(ym) : (homeReminderHTML(ym) || closeCardHTML(ym)));
  if (!st.hasBudget) {
    h += locked ? `<p class="quiet">No budget was set for ${monthLong(ym)}.</p>` : `<section class="empty"><h2>No budget for ${monthLabel(ym)} yet</h2><p>Set one up in about a minute. Every expense you add then shows against it.</p><button type="button" class="btn primary" data-go="budget">Set up ${monthLabel(ym)} budget</button></section>`;

  }
  const dl = daysLeft(ym), isCur = ym === ymOf(today());
  const days = dl > 0 ? `${dl} day${dl === 1 ? '' : 's'} left` : (isCur ? 'Last day of the month' : '');
  if (st.income > 0) {
    const left = st.income - st.spent, over = left < 0;
    const pct = Math.min(100, Math.round(st.spent / st.income * 100));
    h += `<section class="summary ${over ? 'is-over' : ''}"><div class="big">${fmt(Math.abs(left))}</div><div class="biglabel">${over ? 'spent beyond your income' : 'left from your income'}</div><div class="bar"><span style="width:${pct}%"></span></div><div class="caption"><b>${fmt(st.spent)}</b> spent of ${fmt(st.income)} income${days ? '<br>' + days : ''}</div></section>`;
  } else {
    h += `<section class="summary is-neutral"><div class="big">${fmt(st.spent)}</div><div class="biglabel">spent so far</div><div class="caption">${locked ? `No income was added for ${monthLabel(ym)}.` : `No income added for ${monthLabel(ym)} yet. Add it to see what’s left.`}${days ? '<br>' + days : ''}</div>${locked ? '' : '<button type="button" class="btn primary" data-add-income>Add income</button>'}</section>`;

/* ---------- budget editor ---------- */
function draftFrom(lines, ym, dirty, kind) {

  return {
    kind: p.kind, ym, dirty, fromSaved: !dirty,
    rows: lines.map(l => { const c = p.byId(l.catId); return { key: uid(), catId: l.catId, name: c ? c.name : '', icon: c ? c.icon : '🏷️', amount: l.amount }; })
  };
}
function startDraft(how) {

      kind: p.kind, ym, dirty: true, fromSaved: false,
      rows: p.starter.map(x => {

}

  showAuth('signin', 'You\u2019re signed out.', { ok: true });
}
const authUI = { view: 'signin' };
function authHTML(view, msg, data) {
  const hint = `<p class="formhint ${data.ok ? 'ok-msg' : ''}" id="auth-hint">${esc(msg || '')}</p>`;
  const show = `<label class="showpw"><input type="checkbox" data-showpw>Show password</label>`;
  if (view === 'signup') return `<h1>Create your account</h1><p class="lead">Takes about half a minute.</p><form id="f-signup" novalidate>
<label class="field"><span>Your name</span><input name="name" autocomplete="name" enterkeyhint="next"></label>
<label class="field"><span>Email</span><input type="email" name="email" autocomplete="email" inputmode="email" enterkeyhint="next"></label>
<label class="field"><span>Password (8 characters or more)</span><input type="password" name="pw" autocomplete="new-password" enterkeyhint="next"></label>
<label class="field"><span>Repeat password</span><input type="password" name="pw2" autocomplete="new-password" enterkeyhint="done"></label>
${show}${hint}<button type="submit" class="btn primary block">Create account</button></form>
<div class="auth-links"><span></span><button type="button" class="link" data-auth="signin">I already have an account</button></div>`;
  if (view === 'forgot') return `<h1>Reset your password</h1><p class="lead">Enter the email you signed up with.</p><form id="f-forgot" novalidate>
<label class="field"><span>Email</span><input type="email" name="email" autocomplete="email" inputmode="email" enterkeyhint="done"></label>
${hint}<button type="submit" class="btn primary block">Send reset code</button></form>
<div class="auth-links"><button type="button" class="link" data-auth="signin">Back to sign in</button><span></span></div>`;
  if (view === 'reset') return `<h1>Choose a new password</h1><p class="lead">In the real app this code would be emailed to ${esc(data.email)}. For the demo, here it is:</p><div class="auth-code">${data.code}</div>
<form id="f-reset" novalidate><input type="hidden" name="email" value="${esc(data.email)}">
<label class="field"><span>Reset code</span><input name="code" inputmode="numeric" autocomplete="one-time-code" enterkeyhint="next"></label>
<label class="field"><span>New password (8 characters or more)</span><input type="password" name="pw" autocomplete="new-password" enterkeyhint="next"></label>
<label class="field"><span>Repeat new password</span><input type="password" name="pw2" autocomplete="new-password" enterkeyhint="done"></label>
${show}${hint}<button type="submit" class="btn primary block">Set new password</button></form>
<div class="auth-links"><button type="button" class="link" data-auth="signin">Back to sign in</button><span></span></div>`;
  return `<h1>Sign in</h1><p class="lead">Your budget, expenses and income, on your phone.</p><form id="f-signin" novalidate>
<label class="field"><span>Email</span><input type="email" name="email" autocomplete="email" inputmode="email" enterkeyhint="next"></label>
<label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" enterkeyhint="done"></label>
${show}${hint}<button type="submit" class="btn primary block">Sign in</button></form>
<div class="auth-links"><button type="button" class="link" data-auth="forgot">Forgot password?</button><button type="button" class="link" data-auth="signup">Create an account</button></div>
<button type="button" class="btn ghost block" data-demo-login>Try the demo account</button>
<p class="demo-note">Demo account: ${DEMO.email}, password ${DEMO.password}. Accounts in this demo are kept in this browser only.</p>`;
}
function showAuth(view, msg, data) {
  authUI.view = view;
  document.body.classList.add('auth-mode');
  const a = $('#auth'); a.hidden = false;
  a.innerHTML = `<div class="auth-card"><div class="auth-brand">Finance tracker</div>${authHTML(view, msg, data || {})}</div>`;
  const f = a.querySelector('input:not([type=hidden])'); if (f) f.focus();
  window.scrollTo(0, 0);
}
function authHint(msg) { const h = $('#auth-hint'); if (h) h.textContent = msg || ''; }
function formVals(form) { const o = {}; new FormData(form).forEach((v, k) => { o[k] = String(v); }); return o; }
async function doSignIn(email, password) {
  const acc = findAccount(email);
  if (!acc || (await hashPw(password, acc.salt)) !== acc.hash) { authHint('That email and password don\u2019t match.'); return; }
  setSession(acc.id); enterApp(acc, 'home');
}
async function doSignUp(v) {
  const email = v.email.trim().toLowerCase(), name = v.name.trim();
  if (!validEmail(email)) { authHint('Enter a valid email address.'); return; }
  if (v.pw.length < 8) { authHint('Use a password of 8 characters or more.'); return; }
  if (v.pw !== v.pw2) { authHint('The two passwords don\u2019t match.'); return; }
  if (findAccount(email)) { authHint('There\u2019s already an account with that email. Sign in instead.'); return; }
  const salt = randomSalt();
  const acc = { id: uid(), email, name, salt, hash: await hashPw(v.pw, salt), demo: false };
  accounts.push(acc); saveAccounts();
  setSession(acc.id); enterApp(acc, 'home');
  toast(`Welcome${name ? ', ' + name : ''}. Start by adding this month\u2019s income and budget.`, { status: 'ok', long: true });
}
function doForgot(v) {
  const acc = findAccount(v.email);
  if (!acc) { authHint('No account uses that email.'); return; }
  const code = String(Math.floor(100000 + Math.random() * 900000));
  acc.reset = { code, exp: Date.now() + 15 * 60 * 1000 }; saveAccounts();
  showAuth('reset', '', { email: acc.email, code });
}
async function doReset(v) {
  const acc = findAccount(v.email);
  if (!acc || !acc.reset || acc.reset.code !== v.code.trim() || Date.now() > acc.reset.exp) { authHint('That code isn\u2019t right or has expired. Request a new one.'); return; }
  if (v.pw.length < 8) { authHint('Use a password of 8 characters or more.'); return; }
  if (v.pw !== v.pw2) { authHint('The two passwords don\u2019t match.'); return; }
  acc.salt = randomSalt(); acc.hash = await hashPw(v.pw, acc.salt); delete acc.reset; saveAccounts();
  showAuth('signin', 'Password updated. Sign in with your new password.', { ok: true });
}
async function doChangePassword(v) {
  if (!currentUser) return;
  if ((await hashPw(v.current, currentUser.salt)) !== currentUser.hash) { hint('Your current password isn\u2019t right.'); return; }
  if (v.pw.length < 8) { hint('Use a new password of 8 characters or more.'); return; }
  if (v.pw !== v.pw2) { hint('The two new passwords don\u2019t match.'); return; }
  currentUser.salt = randomSalt(); currentUser.hash = await hashPw(v.pw, currentUser.salt); saveAccounts();
  closeSheet(); toast('Password changed', { status: 'ok' });
}

/* ---------- toast ---------- */
let toastTimer = null, toastUndo = null;
function toast(msg, opts = {}) {
  const t = $('#toast');
  toastUndo = opts.undo || null;
  t.className = 'toast show ' + (opts.status || '');
  t.innerHTML = `<span>${esc(msg)}</span>${opts.undo ? '<button type="button" data-undo>Undo</button>' : ''}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, opts.undo || opts.long ? 5000 : 2500);
}
function hideToast() { const t = $('#toast'); t.className = 'toast'; toastUndo = null; }

/* ---------- navigation ---------- */
function go(view, keepFilter) {
  ui.view = view;
  if (!keepFilter) ui.filterCat = null;
  render(); window.scrollTo(0, 0);
}
function changeMonth(n) {
  if (ui.view === 'budget' && ui.draft && ui.draft.dirty) { toast('Save or discard your changes first'); return; }
  ui.month = addMonths(ui.month, n); ui.filterCat = null; ui.draft = null; ui.quickOpen = false;
  render(); window.scrollTo(0, 0);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('#sheet-root')) return;
  const b = e.target.closest('[data-go],[data-m],[data-settings],[data-cat],[data-start],[data-save-budget],[data-discard],[data-addrow],[data-quick-add],[data-quick-open],[data-quick-close],[data-src-open],[data-src-close],[data-src-add],[data-src-remove],[data-remove],[data-exp],[data-del],[data-inc],[data-del-inc],[data-add-income],[data-clear-filter],[data-undo],[data-endmonth],#fab');
  if (!b) return;
  if (b.id === 'fab') { if (ui.view === 'income') openIncomeSheet(); else openExpenseSheet({ catId: ui.view === 'expenses' ? ui.filterCat : null }); return; }
  if (b.dataset.inc) { const it = state.income.find(x => x.id === b.dataset.inc); if (it) openIncomeSheet({ income: it }); return; }
  if (b.dataset.delInc) { deleteIncome(b.dataset.delInc); render(); return; }
  if (b.hasAttribute('data-add-income')) { openIncomeSheet(); return; }
  if (b.dataset.endmonth) { openCloseSheet(b.dataset.endmonth); return; }
  if (b.dataset.go) { go(b.dataset.go, false); return; }
  if (b.dataset.m) { changeMonth(Number(b.dataset.m)); return; }
  if (b.hasAttribute('data-settings')) { openSettings(); return; }
  if (b.dataset.cat) { ui.filterCat = b.dataset.cat; go('expenses', true); return; }
  if (b.dataset.start) { startDraft(b.dataset.start); return; }
  if (b.hasAttribute('data-save-budget')) { saveBudget(); return; }
  if (b.hasAttribute('data-discard')) { ui.draft = null; ui.quickOpen = false; render(); return; }
  if (b.hasAttribute('data-addrow')) { addRow(true); return; }
  if (b.hasAttribute('data-quick-open')) { ui.quickOpen = true; render(); const q = $('#q-cat'); if (q) q.focus(); return; }
  if (b.hasAttribute('data-quick-close')) { ui.quickOpen = false; render(); return; }
  if (b.hasAttribute('data-quick-add')) { quickAdd(); return; }
  if (b.hasAttribute('data-src-open')) { ui.srcQuickOpen = true; renderSources(); const q = $('#src-q'); if (q) q.focus(); return; }
  if (b.hasAttribute('data-src-close')) { ui.srcQuickOpen = false; renderSources(); return; }
  if (b.hasAttribute('data-src-add')) { const n = $('#src-newname'); if (n && !n.value.trim()) { n.focus(); return; } addSource(n ? n.value : ''); return; }
  if (b.hasAttribute('data-src-remove')) { const r = b.closest('.brow'); if (r) removeSource(r.dataset.sid); return; }
  if (b.hasAttribute('data-remove')) { const row = b.closest('.brow'); if (row) removeRow(row.dataset.key); return; }
  if (b.dataset.exp) { const ex = state.expenses.find(x => x.id === b.dataset.exp); if (ex) openExpenseSheet({ expense: ex }); return; }
  if (b.dataset.del) { deleteExpense(b.dataset.del); render(); return; }
  if (b.hasAttribute('data-clear-filter')) { ui.filterCat = null; render(); return; }
  if (b.hasAttribute('data-undo')) { if (toastUndo) { toastUndo(); } hideToast(); render(); return; }
});
main.addEventListener('input', e => {
  if (e.target.hasAttribute('data-src-name')) {
    const r = e.target.closest('.brow'), x = srcById(r.dataset.sid), v = e.target.value.trim();
    if (x && v) { x.name = v; x.icon = srcIcon(v); r.querySelector('.ci').textContent = x.icon; save(); }
    return;
  }
  if (e.target.id === 'q-amt') { liveFormat(e.target); return; }
  const f = e.target.dataset.field; if (!f || !ui.draft) return;
  const row = rowByEl(e.target); if (!row) return;
  ui.draft.dirty = true;
  if (f === 'name') {
    row.name = e.target.value;
    if (!row.catId) { row.icon = P().icon(row.name); e.target.closest('.brow').querySelector('.ci').textContent = row.icon; }
  } else { liveFormat(e.target); row.amount = parseAmount(e.target.value); updateTotal(); }
  updateFootNote();
});
main.addEventListener('change', e => {
  if (e.target.id === 'src-q') {
    const v = e.target.value, row = $('#src-new-row');
    if (v === '__new__') { if (row) row.style.display = ''; const n = $('#src-newname'); if (n) n.focus(); }
    else if (v.indexOf('sugg:') === 0) addSource(v.slice(5));
    return;
  }
  if (e.target.id !== 'q-cat') return;
  const val = e.target.value, row = $('#q-new-row');
  if (val === '__new__') {
    if (row) row.style.display = '';
    const nEl = $('#q-newname'); if (nEl) nEl.focus();
  } else {
    if (row) row.style.display = 'none';
    let name = null;
    if (val.indexOf('id:') === 0) { const c = P().byId(val.slice(3)); name = c ? c.name : null; }
    else if (val.indexOf('sugg:') === 0) { name = val.slice(5); }
    const aEl = $('#q-amt');
    if (name && aEl && !parseAmount(aEl.value)) { const la = lastAmountFor(name); if (la.known) aEl.value = fmtInput(la.amount); }
  }
});
main.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'src-newname') { e.preventDefault(); if (e.target.value.trim()) addSource(e.target.value); return; }
  if (e.target.hasAttribute('data-src-name')) { e.preventDefault(); e.target.blur(); return; }
  if (e.target.id === 'q-newname') { e.preventDefault(); $('#q-amt').focus(); return; }
  if (e.target.id === 'q-amt') { e.preventDefault(); quickAdd(); return; }
  const f = e.target.dataset.field; if (!f) return;
  e.preventDefault();
  const el = e.target.closest('.brow');
  if (f === 'name') { el.querySelector('[data-field=amount]').focus(); }
  else { const next = el.nextElementSibling; if (next) next.querySelector('[data-field=name]').focus(); else { const q = $('#q-cat'); if (q) q.focus(); } }
});
main.addEventListener('focusout', e => {
  if (e.target.hasAttribute && e.target.hasAttribute('data-src-name')) { const x = srcById(e.target.closest('.brow').dataset.sid); if (x) e.target.value = x.name; return; }
  if (e.target.dataset && e.target.dataset.field === 'amount') { const row = rowByEl(e.target); if (row) e.target.value = row.amount ? fmtInput(row.amount) : ''; }
});
sheetRoot.addEventListener('click', e => {
  if (e.target.classList.contains('backdrop')) { closeSheet(); return; }
  const b = e.target.closest('[data-close],[data-date],[data-save],[data-save-more],[data-delete],[data-reset],[data-confirm-close],[data-change-pw],[data-logout]');
  if (!b) return;
  if (b.hasAttribute('data-close')) closeSheet();
  else if (b.dataset.date) { if (b.disabled) return; es.date = b.dataset.date; refreshDates(); }
  else if (b.hasAttribute('data-save')) { if (es && es.kind === 'income') saveIncome(false); else saveExpense(false); }
  else if (b.hasAttribute('data-save-more')) { if (es && es.kind === 'income') saveIncome(true); else saveExpense(true); }
  else if (b.hasAttribute('data-delete')) { const id = es.id, isInc = es.kind === 'income'; closeSheet(); if (isInc) deleteIncome(id); else deleteExpense(id); render(); }
  else if (b.hasAttribute('data-reset')) resetDemo(b);
  else if (b.hasAttribute('data-change-pw')) openChangePassword();
  else if (b.hasAttribute('data-logout')) logout();
  else if (b.dataset.confirmClose) {
    const ym = b.dataset.confirmClose; closeSheet();
    if (closeMonth(ym, false)) toast(`${monthLong(ym)} closed. ${carryText(ym, state.closed[ym].carry)}`, { status: 'ok', long: true });
    render();
  }
});
sheetRoot.addEventListener('input', e => {
  if (!es) return;
  if (e.target.id === 'amt') { liveFormat(e.target); es.amount = parseAmount(e.target.value); if (es.amount > 0) hint(''); }
  else if (e.target.id === 'desc') { es.desc = e.target.value; }
});
sheetRoot.addEventListener('change', e => {
  if (e.target.id === 'dpick' && e.target.value && es) { es.date = e.target.value; refreshDates(); }
  else if (e.target.id === 'cat-select') { es.catId = e.target.value || null; hint(''); const st = monthStats(es.ym); e.target.className = 'catselect ' + selectStatusClass(st.rows, es.catId); }
  else if (e.target.id === 'src-select' && es) { es.srcId = e.target.value || null; hint(''); }
  else if (e.target.name === 'cur') { state.settings.currency = e.target.value; save(); render(); }
  else if (e.target.id === 'near-pct') {
    let v = Math.round(Number(e.target.value));
    if (!(v >= 1 && v <= 99)) v = 80;
    e.target.value = v;
    state.settings.nearPct = v; save(); render();
  }
  else if (e.target.id === 'close-day') {
    let v = Math.round(Number(e.target.value));
    if (!(v >= 1 && v <= 28)) v = 15;
    e.target.value = v;
    state.settings.closeDay = v; save(); runAutoClose(); render();
  }
});
sheetRoot.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.key !== 'Enter' || !es) return;
  const id = e.target.id;
  if (id === 'amt') { e.preventDefault(); $('#desc').focus(); }
  else if (id === 'desc') { e.preventDefault(); if (es.kind === 'income') saveIncome(false); else saveExpense(false); }
});

/* ---------- start ---------- */
const authRoot = $('#auth');
authRoot.addEventListener('submit', e => {
  e.preventDefault();
  const v = formVals(e.target);
  if (e.target.id === 'f-signin') doSignIn(v.email, v.password);
  else if (e.target.id === 'f-signup') doSignUp(v);
  else if (e.target.id === 'f-forgot') doForgot(v);
  else if (e.target.id === 'f-reset') doReset(v);
});
authRoot.addEventListener('click', e => {
  const b = e.target.closest('[data-auth],[data-demo-login]'); if (!b) return;
  if (b.dataset.auth) showAuth(b.dataset.auth);
  else doSignIn(DEMO.email, DEMO.password);
});
document.addEventListener('change', e => {
  if (!e.target.hasAttribute || !e.target.hasAttribute('data-showpw')) return;
  const scope = e.target.closest('form') || e.target.closest('.auth-card') || document;
  scope.querySelectorAll('input[type=password],input[data-pw]').forEach(i => { i.type = e.target.checked ? 'text' : 'password'; i.setAttribute('data-pw', '1'); });
});
sheetRoot.addEventListener('submit', e => { if (e.target.id === 'f-changepw') { e.preventDefault(); doChangePassword(formVals(e.target)); } });
const token = (location.hash || '').replace('#', '');
const startView = ['home', 'budget', 'expenses', 'sources', 'income'].includes(token) ? token : 'home';
(async () => {
  accounts = loadAccounts();
  await ensureDemoAccount();
  const sid = loadSession(), acc = sid && accounts.find(a => a.id === sid);
  if (acc) enterApp(acc, startView); else showAuth('signin');
})();
document.addEventListener('visibilitychange', () => { if (state && !document.hidden && runAutoClose().length) render(); });
})();
</script>
</body>
