<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Personal Finance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600;700&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4F1; --surface:#FFFFFF; --surface-2:#F3F7F5; --ink:#2A2622; --ink-2:#6E675F; --ink-3:#9A938B; --line:#D7E1DC;
  --brand:#EA5F2E; --brand-ink:#FFFFFF; --teal:#17857A; --teal-soft:#DCF1EC;
  --over:#B3261E; --over-soft:#FBE9E7; --near:#8A5500; --near-soft:#FFF1D1; --ok:#1E7A46; --ok-soft:#E1F3E7;
  --toast-bg:#2A2622; --toast-fg:#F6F4EF; --toast-over:#FFB3AA; --toast-near:#FFD88A; --toast-ok:#9FE3B8; --toast-undo:#FFD9CB;
  --shadow:0 10px 30px rgba(42,38,34,.14);
  --nav-h:64px; --radius:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131C18; --surface:#1C2722; --surface-2:#223029; --ink:#F2EFE8; --ink-2:#B2BBB5; --ink-3:#7E8882; --line:#2F3E37;
    --brand:#FF7A4A; --brand-ink:#1A120D; --teal:#4CC4AE; --teal-soft:#1F3B36;
    --over:#FF8F86; --over-soft:#4A211D; --near:#F2C06B; --near-soft:#4A3712; --ok:#7FD6A1; --ok-soft:#173B29;
    --toast-bg:#F2EFE8; --toast-fg:#1C2722; --toast-over:#B3261E; --toast-near:#8A5500; --toast-ok:#1E7A46; --toast-undo:#C2461D;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131C18; --surface:#1C2722; --surface-2:#223029; --ink:#F2EFE8; --ink-2:#B2BBB5; --ink-3:#7E8882; --line:#2F3E37;
  --brand:#FF7A4A; --brand-ink:#1A120D; --teal:#4CC4AE; --teal-soft:#1F3B36;
  --over:#FF8F86; --over-soft:#4A211D; --near:#F2C06B; --near-soft:#4A3712; --ok:#7FD6A1; --ok-soft:#173B29;
  --toast-bg:#F2EFE8; --toast-fg:#1C2722; --toast-over:#B3261E; --toast-near:#8A5500; --toast-ok:#1E7A46; --toast-undo:#C2461D;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fira Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body.noscroll{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3,.big{font-family:'Fira Sans Condensed','Fira Sans',system-ui,sans-serif;font-weight:700;letter-spacing:-.01em}
h1{font-size:26px;margin:0;line-height:1.15}
h2{font-size:20px;margin:24px 0 8px}
h3{font-size:16px;margin:16px 0 8px;color:var(--ink-2);font-weight:600}
p{margin:0 0 12px}
main{padding:12px 16px calc(var(--nav-h) + 112px);max-width:560px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 6px}
.brand{font-family:'Fira Sans Condensed','Fira Sans',sans-serif;font-weight:700;font-size:18px;color:var(--ink-2)}
.monthbar{display:flex;align-items:center;gap:4px;margin:4px 0 12px}
.monthbar h1{flex:1;text-align:center}
.iconbtn{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:0 0 auto}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.summary{background:var(--surface);border-radius:var(--radius);padding:20px 18px 16px;box-shadow:var(--shadow);margin-bottom:8px}
.big{font-size:44px;line-height:1;color:var(--ok)}
.summary.is-over .big{color:var(--over)}
.biglabel{color:var(--ink-2);margin:4px 0 14px}
.bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar span{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .4s ease}
.summary.is-over .bar span{background:var(--over)}
.caption{margin-top:10px;color:var(--ink-2);font-size:14px}
.caption b{font-weight:500;color:var(--ink)}
.list{display:flex;flex-direction:column;gap:6px}
.catrow,.exprow{width:100%;display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:56px}
.catrow:active,.exprow:active{background:var(--surface-2)}
.ci{font-size:22px;text-align:center;line-height:1}
.cn{min-width:0;display:flex;flex-direction:column}
.cn .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn .sub{font-size:13px;color:var(--ink-2)}
.minibar{display:block;height:4px;border-radius:99px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--ok)}
.catrow.over .minibar i{background:var(--over)}
.catrow.near .minibar i,.catrow.short .minibar i{background:var(--near)}
.cs{font-weight:600;white-space:nowrap;font-size:15px}
.catrow.over .cs{color:var(--over)}
.catrow.near .cs,.catrow.short .cs{color:var(--near)}
.catrow.ok .cs{color:var(--ok)}
.quiet{color:var(--ink-2)}
.small{font-size:13px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:24px 18px;text-align:center}
.empty h2{margin-top:0}
.empty p{color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;font-weight:600;border:1px solid transparent}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.primary:active{filter:brightness(.95)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.danger{color:var(--over);background:var(--over-soft)}
.btn.block{width:100%}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .navbrand{display:none}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:var(--ink-3)}
.nav button.on{color:var(--teal)}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);width:60px;height:60px;border-radius:999px;background:var(--brand);color:var(--brand-ink);box-shadow:0 8px 24px rgba(234,95,46,.4);display:flex;align-items:center;justify-content:center;z-index:21}
.fab svg{width:28px;height:28px}
.fab.hidden{display:none}
.filter{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:4px 6px 4px 12px;font-weight:500;margin-bottom:8px}
.chip-x{width:28px;height:28px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center}
.chip-x svg{width:16px;height:16px}
.exptotal{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 4px;color:var(--ink-2)}
.exptotal strong{color:var(--ink);font-size:18px;font-family:'Fira Sans Condensed','Fira Sans',sans-serif}
.day{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);margin:18px 2px 6px}
.day span{font-weight:500}
.swipe{position:relative;overflow:hidden;border-radius:12px;margin-bottom:6px}
.swipe-action{position:absolute;top:0;bottom:0;right:0;width:88px;background:var(--over);color:#fff;font-weight:600;border-radius:0 12px 12px 0}
.swipe-body{position:relative;transition:transform .2s ease;will-change:transform}
.swipe.dragging .swipe-body{transition:none}
.exprow .amt{font-weight:600;white-space:nowrap}
.option{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:10px;display:flex;flex-direction:column;gap:2px}
.option strong{font-size:17px}
.option span{color:var(--ink-2);font-size:14px}
.option:active{border-color:var(--teal)}
.editor{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:24px 30px 1fr 36px;grid-template-rows:auto auto;align-items:center;column-gap:8px;row-gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 6px}
.brow.dragging{box-shadow:var(--shadow);opacity:.92;z-index:2}
.handle{touch-action:none;cursor:grab;color:var(--ink-3);display:flex;align-items:center;justify-content:center;height:40px}
.handle svg{width:18px;height:18px}
.brow .ci{font-size:20px}
.brow input{border:0;background:transparent;padding:6px 8px;border-radius:8px;min-width:0;width:100%}
.brow input:focus{background:var(--surface-2);outline:2px solid var(--teal)}
.brow .name{font-weight:500}
.brow .remove{width:36px;height:36px;border-radius:999px;color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center}
.brow .remove svg{width:18px;height:18px}
.brow .r2{grid-column:3 / 5;display:flex;align-items:center;gap:8px}
.goal{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.goal.on{background:var(--teal-soft);color:var(--teal);border-color:transparent}
.amtwrap{margin-left:auto;display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:10px;padding:0 8px;min-width:150px}
.amtwrap .sym{color:var(--ink-2)}
.amtwrap input{text-align:right;font-weight:600;font-size:17px;background:transparent}
.addrow{align-self:flex-start;color:var(--teal);font-weight:600;padding:12px 4px;margin-top:4px}
.editfoot{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 16px;margin-top:12px;box-shadow:var(--shadow)}
.editfoot .total{flex:1;line-height:1.2}
.editfoot .total small{display:block;color:var(--ink-2);font-size:13px}
.editfoot .total strong{font-size:20px;font-family:'Fira Sans Condensed','Fira Sans',sans-serif}
.editfoot .link{color:var(--ink-2);font-size:14px;text-decoration:underline;padding:8px 4px}
.backdrop{position:fixed;inset:0;background:rgba(20,30,26,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sh-head h2{margin:8px 0;font-size:20px}
.recent-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.recent-scroll::-webkit-scrollbar{display:none}
.rchip{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;max-width:170px;text-align:left}
.rchip span{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rchip small{color:var(--ink-2)}
.amount{display:flex;align-items:baseline;gap:6px;padding:8px 4px 4px;border-bottom:2px solid var(--line);margin-bottom:12px}
.amount:focus-within{border-color:var(--teal)}
.amount .sym{font-size:28px;color:var(--ink-2);font-family:'Fira Sans Condensed','Fira Sans',sans-serif;font-weight:600}
.amount input{flex:1;border:0;background:transparent;font-family:'Fira Sans Condensed','Fira Sans',sans-serif;font-weight:700;font-size:44px;line-height:1.1;padding:0;min-width:0;outline:none}
.amount input::placeholder{color:var(--ink-3)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.chips .hint{grid-column:1/-1;color:var(--ink-2);font-size:14px;margin:0}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:58px}
.chip.on{border-color:var(--teal);background:var(--teal-soft)}
.chip-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip-sub{font-size:12px;color:var(--ink-2)}
.chip.over .chip-sub{color:var(--over)}
.chip.near .chip-sub,.chip.short .chip-sub{color:var(--near)}
.chip.ok .chip-sub{color:var(--ok)}
.chip.new{border-style:dashed;color:var(--teal)}
.chip.new .chip-sub{color:var(--ink-3)}
.newcat{grid-column:1/-1;background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.newcat input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);width:100%}
.newcat .row{display:flex;gap:8px}
.newcat .row .btn{min-height:44px;flex:1}
.dates{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.dchip{position:relative;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;min-height:40px}
.dchip.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.dchip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.desc{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);margin-bottom:8px;outline:none}
.desc:focus{border-color:var(--teal)}
.formhint{min-height:20px;color:var(--over);font-size:14px;margin:0 0 8px 2px}
.actions{display:flex;flex-direction:column;gap:8px}
.radios{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.radio{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.radio:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.radio input{width:20px;height:20px;accent-color:var(--teal);margin:0}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:60;background:var(--toast-bg);color:var(--toast-fg);border-radius:12px;padding:12px 14px;display:none;align-items:center;gap:12px;box-shadow:var(--shadow);font-weight:500}
.toast.show{display:flex}
.toast span{flex:1}
.toast button{color:var(--toast-undo);font-weight:700;padding:4px 6px}
.toast.over span{color:var(--toast-over)}
.toast.near span,.toast.short span{color:var(--toast-near)}
.toast.ok span{color:var(--toast-ok)}
@media (min-width:840px){
  .nav{position:fixed;top:0;bottom:0;left:0;right:auto;width:220px;height:auto;flex-direction:column;justify-content:flex-start;gap:4px;padding:28px 14px;border-top:0;border-right:1px solid var(--line)}
  .nav .navbrand{display:block;font-family:'Fira Sans Condensed','Fira Sans',sans-serif;font-weight:700;font-size:20px;padding:0 14px 20px;color:var(--ink)}
  .nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;font-size:16px;padding:12px 14px;border-radius:12px}
  .nav button.on{background:var(--teal-soft)}
  main{margin-left:220px;max-width:720px;padding:40px 48px 120px}
  .topbar .brand{display:none}
  .fab{right:40px;bottom:40px}
  .editfoot{bottom:16px}
  .backdrop{align-items:center}
  .sheet{max-width:520px;border-radius:22px;padding-bottom:20px}
  .toast{left:auto;right:40px;bottom:112px;width:380px}
  .big{font-size:56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav" aria-label="Main">
    <div class="navbrand">Finance tracker</div>

  </nav>
  <main id="main"></main>
  <button type="button" class="fab" id="fab" aria-label="Add expense"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<div id="sheet-root"></div>

function seed() {

      body.style.transform = open ? 'translateX(-88px)' : '';
    });
    body.addEventListener('click', e => { if (open) { e.preventDefault(); e.stopPropagation(); open = false; body.style.transform = ''; } }, true);
  });
}
function deleteExpense(id) {
  const idx = state.expenses.findIndex(x => x.id === id); if (idx < 0) return;
  const e = state.expenses[idx];
  state.expenses.splice(idx, 1); save();
  toast('Expense deleted', { undo: () => { state.expenses.splice(Math.min(idx, state.expenses.length), 0, e); save(); } });
}

/* ---------- sheets ---------- */
const sheetRoot = $('#sheet-root');
let es = null;
function openSheet(html) {
  sheetRoot.innerHTML = `<div class="backdrop"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.classList.add('noscroll');
}
function closeSheet() { sheetRoot.innerHTML = ''; document.body.classList.remove('noscroll'); es = null; }
function defaultDate(ym) {
  const t = todayISO(); if (t.startsWith(ym)) return t;
  return ym < ymOf(today()) ? ym + '-' + pad(daysInMonth(ym)) : ym + '-01';
}
function openExpenseSheet(opts = {}) {
  const ex = opts.expense || null, ym = ui.month;
  es = { mode: ex ? 'edit' : 'add', id: ex ? ex.id : null, amount: ex ? ex.amount : 0, catId: ex ? ex.catId : (opts.catId || null), date: ex ? ex.date : defaultDate(ym), desc: ex ? (ex.desc || '') : '', ym };
  openSheet(expenseSheetHTML());
  const a = $('#amt'); if (a) { a.focus(); try { a.setSelectionRange(a.value.length, a.value.length); } catch (e) { /* ignore */ } }
}
function recentHTML() {
  const seen = new Set(), items = [];
  for (let i = state.expenses.length - 1; i >= 0 && items.length < 6; i--) {
    const e = state.expenses[i], key = (e.desc || '').toLowerCase() + '|' + e.catId;
    if (seen.has(key)) continue; seen.add(key);
    const c = catById(e.catId); if (!c) continue;
    items.push({ e, c });
  }
  if (!items.length) return '';
  return `<div class="recent"><div class="recent-scroll">${items.map(x => `<button type="button" class="rchip" data-repeat="${x.e.id}"><span>${esc(x.e.desc || x.c.name)}</span><small>${fmt(x.e.amount)}</small></button>`).join('')}</div></div>`;
}
function chipsHTML(withNew = true) {
  const st = monthStats(es.ym), usage = {};
  state.expenses.forEach(e => { usage[e.catId] = (usage[e.catId] || 0) + 1; });
  const rows = st.rows.slice().sort((a, b) => (usage[b.cat.id] || 0) - (usage[a.cat.id] || 0) || a.cat.sort - b.cat.sort);
  let h = rows.length ? '' : `<p class="hint">No budget for ${monthLabel(es.ym)} yet. Add a category here, or set up the month on the Budget tab.</p>`;
  h += rows.map(r => `<button type="button" class="chip ${r.status} ${es.catId === r.cat.id ? 'on' : ''}" data-pick="${r.cat.id}" aria-pressed="${es.catId === r.cat.id}"><span class="chip-name">${r.cat.icon} ${esc(r.cat.name)}</span><span class="chip-sub">${r.label}</span></button>`).join('');
  if (withNew) h += `<button type="button" class="chip new" data-newcat><span class="chip-name">+ New</span><span class="chip-sub">Add a category</span></button>`;
  return h;
}
function datesHTML() {
  const t = todayISO(), y = yesterdayISO(), other = es.date !== t && es.date !== y;
  return `<button type="button" class="dchip ${es.date === t ? 'on' : ''}" data-date="${t}">Today</button><button type="button" class="dchip ${es.date === y ? 'on' : ''}" data-date="${y}">Yesterday</button><label class="dchip ${other ? 'on' : ''}"><span>${other ? dayLabel(es.date) : 'Pick a date'}</span><input type="date" id="dpick" value="${es.date}" aria-label="Pick a date"></label>`;
}
function expenseSheetHTML() {
  const descs = [], seen = new Set();
  for (let i = state.expenses.length - 1; i >= 0 && descs.length < 30; i--) {
    const d = (state.expenses[i].desc || '').trim(); if (!d) continue;
    const k = d.toLowerCase(); if (seen.has(k)) continue; seen.add(k); descs.push(d);
  }
  const edit = es.mode === 'edit';
  return `<div class="sh-head"><h2>${edit ? 'Edit expense' : 'Add expense'}</h2><button type="button" class="iconbtn" data-close aria-label="Close">${ICON.close}</button></div>
${edit ? '' : recentHTML()}
<div class="amount"><span class="sym">${sym()}</span><input id="amt" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="0" value="${es.amount ? fmtInput(es.amount) : ''}" aria-label="Amount"></div>
<div class="chips" id="chips">${chipsHTML()}</div>
<div class="dates" id="dates">${datesHTML()}</div>
<input class="desc" id="desc" list="desc-list" placeholder="What was it? (optional)" autocomplete="off" value="${esc(es.desc)}" aria-label="Description">
<datalist id="desc-list">${descs.map(d => `<option value="${esc(d)}"></option>`).join('')}</datalist>
<p class="formhint" id="hint"></p>
<div class="actions">${edit ? `<button type="button" class="btn primary" data-save>Save changes</button><button type="button" class="btn danger" data-delete>Delete expense</button>` : `<button type="button" class="btn primary" data-save>Save</button><button type="button" class="btn ghost" data-save-more>Save and add another</button>`}</div>`;
}
function hint(msg) { const h = $('#hint'); if (h) h.textContent = msg || ''; }
function refreshChips() { const c = $('#chips'); if (c) c.innerHTML = chipsHTML(); }
function refreshDates() { const d = $('#dates'); if (d) d.innerHTML = datesHTML(); }
function showNewCat() {
  const c = $('#chips'); if (!c) return;
  c.innerHTML = `<div class="newcat"><input id="nc-name" placeholder="Category name" autocomplete="off" enterkeyhint="next" aria-label="Category name"><input id="nc-amt" inputmode="decimal" placeholder="Budget for ${monthLabel(es.ym)} (optional)" autocomplete="off" enterkeyhint="done" aria-label="Budget amount"><div class="row"><button type="button" class="btn ghost" data-newcat-cancel>Cancel</button><button type="button" class="btn primary" data-newcat-add>Add category</button></div></div>` + chipsHTML(false);
  $('#nc-name').focus();
}
function addNewCat() {
  const nameEl = $('#nc-name'), amtEl = $('#nc-amt'); if (!nameEl) return;
  const name = nameEl.value.trim(); if (!name) { nameEl.focus(); return; }
  const amt = parseAmount(amtEl.value);
  let cat = state.categories.find(c => c.name.toLowerCase() === name.toLowerCase());
  if (!cat) { cat = { id: uid(), name, icon: iconFor(name), sort: state.categories.length, savings: false, archived: false }; state.categories.push(cat); }
  const lines = state.budgets[es.ym] || (state.budgets[es.ym] = []);
  if (!lines.find(l => l.catId === cat.id)) lines.push({ catId: cat.id, amount: amt });
  save();
  if (ui.draft && ui.draft.ym === es.ym && !ui.draft.dirty) ui.draft = null;
  es.catId = cat.id; refreshChips(); hint('');
  toast(`${cat.name} added to ${monthLabel(es.ym)} budget`, { status: 'ok' });
  const a = $('#amt'); if (a && !parseAmount(a.value)) a.focus();
}
function repeat(id) {
  const e = state.expenses.find(x => x.id === id); if (!e) return;
  es.amount = e.amount; es.catId = e.catId; es.desc = e.desc || '';
  $('#amt').value = fmtInput(e.amount); $('#desc').value = es.desc;
  refreshChips(); hint('');
}
function suggestCat(val) {
  const v = (val || '').trim().toLowerCase(); if (!v || es.catId) return;
  const counts = {};
  state.expenses.forEach(e => { if ((e.desc || '').trim().toLowerCase() === v) counts[e.catId] = (counts[e.catId] || 0) + 1; });
  const best = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  if (best && (state.budgets[es.ym] || []).find(l => l.catId === best)) { es.catId = best; refreshChips(); }
}
function saveExpense(keepOpen) {
  const amtEl = $('#amt'); if (!amtEl || !es) return;
  const amt = parseAmount(amtEl.value); es.amount = amt;
  if (amt <= 0) { hint('Enter an amount'); amtEl.focus(); return; }
  if (!es.catId) { hint('Pick a category'); return; }
  const desc = ($('#desc').value || '').trim();
  let undo;
  if (es.mode === 'edit') {
    const e = state.expenses.find(x => x.id === es.id); if (!e) { closeSheet(); return; }
    const before = Object.assign({}, e);
    Object.assign(e, { amount: amt, catId: es.catId, date: es.date, desc });
    undo = () => { Object.assign(e, before); save(); };
  } else {
    const e = { id: uid(), catId: es.catId, date: es.date, amount: amt, desc };
    state.expenses.push(e);
    undo = () => { state.expenses = state.expenses.filter(x => x.id !== e.id); save(); };
  }
  save();
  const ym = es.date.slice(0, 7), st = monthStats(ym), r = st.rows.find(x => x.cat.id === es.catId), cat = catById(es.catId);
  toast(r ? `${r.cat.name}: ${r.label}` : `Saved under ${cat ? cat.name : 'category'}`, { status: r ? r.status : '', undo });
  if (ui.month !== ym) { ui.month = ym; ui.draft = null; }
  if (keepOpen) {
    es.amount = 0; es.desc = ''; es.ym = ym;
    amtEl.value = ''; $('#desc').value = ''; hint('');
    const rec = $('.recent'); if (rec) rec.outerHTML = recentHTML();
    refreshChips(); render(); amtEl.focus();
  } else { closeSheet(); render(); }
}
function openSettings() {
  openSheet(`<div class="sh-head"><h2>Settings</h2><button type="button" class="iconbtn" data-close aria-label="Close">${ICON.close}</button></div>
<h3>Currency</h3><p class="quiet small">One currency at a time. Amounts keep their numbers; only the symbol and format change.</p>
<div class="radios">${Object.values(CURRENCIES).map(c => `<label class="radio"><input type="radio" name="cur" value="${c.code}" ${state.settings.currency === c.code ? 'checked' : ''}><span>${c.label}</span></label>`).join('')}</div>
<h3>Demo data</h3><p class="quiet small">Everything here is sample data kept in this browser. Reset puts the original set back.</p>
<button type="button" class="btn ghost block" data-reset>Reset demo data</button>
<p class="quiet small" style="margin-top:16px">Personal Finance Tracker, phase 1 demo. No account, no server.</p>`);
}
function resetDemo(btn) {
  if (btn.dataset.armed) {
    state = seed(); save();
    ui.draft = null; ui.filterCat = null; ui.month = ymOf(today());
    closeSheet(); render(); toast('Demo data reset', { status: 'ok' }); return;
  }
  btn.dataset.armed = '1'; btn.textContent = 'Tap again to reset'; btn.classList.add('danger');
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = 'Reset demo data'; btn.classList.remove('danger'); } }, 4000);
}

/* ---------- toast ---------- */
let toastTimer = null, toastUndo = null;
function toast(msg, opts = {}) {
  const t = $('#toast');
  toastUndo = opts.undo || null;
  t.className = 'toast show ' + (opts.status || '');
  t.innerHTML = `<span>${esc(msg)}</span>${opts.undo ? '<button type="button" data-undo>Undo</button>' : ''}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, opts.undo ? 5000 : 2500);
}
function hideToast() { const t = $('#toast'); t.className = 'toast'; toastUndo = null; }

/* ---------- navigation ---------- */
function go(view, keepFilter) {
  ui.view = view;
  if (!keepFilter) ui.filterCat = null;
  render(); window.scrollTo(0, 0);
}
function changeMonth(n) {
  if (ui.view === 'budget' && ui.draft && ui.draft.dirty) { toast('Save or discard your budget changes first'); return; }
  ui.month = addMonths(ui.month, n); ui.filterCat = null; ui.draft = null;
  render(); window.scrollTo(0, 0);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('#sheet-root')) return;
  const b = e.target.closest('[data-go],[data-m],[data-settings],[data-cat],[data-start],[data-save-budget],[data-discard],[data-addrow],[data-remove],[data-goal],[data-exp],[data-del],[data-clear-filter],[data-undo],#fab');
  if (!b) return;
  if (b.id === 'fab') { openExpenseSheet({ catId: ui.view === 'expenses' ? ui.filterCat : null }); return; }
  if (b.dataset.go) { go(b.dataset.go, false); return; }
  if (b.dataset.m) { changeMonth(Number(b.dataset.m)); return; }
  if (b.hasAttribute('data-settings')) { openSettings(); return; }
  if (b.dataset.cat) { ui.filterCat = b.dataset.cat; go('expenses', true); return; }
  if (b.dataset.start) { startDraft(b.dataset.start); return; }
  if (b.hasAttribute('data-save-budget')) { saveBudget(); return; }
  if (b.hasAttribute('data-discard')) { ui.draft = null; render(); return; }
  if (b.hasAttribute('data-addrow')) { addRow(true); return; }
  if (b.hasAttribute('data-remove')) { const row = b.closest('.brow'); if (row) removeRow(row.dataset.key); return; }
  if (b.hasAttribute('data-goal')) { const r = rowByEl(b); if (r) { r.savings = !r.savings; ui.draft.dirty = true; b.classList.toggle('on', r.savings); b.setAttribute('aria-pressed', String(r.savings)); } return; }
  if (b.dataset.exp) { const ex = state.expenses.find(x => x.id === b.dataset.exp); if (ex) openExpenseSheet({ expense: ex }); return; }
  if (b.dataset.del) { deleteExpense(b.dataset.del); render(); return; }
  if (b.hasAttribute('data-clear-filter')) { ui.filterCat = null; render(); return; }
  if (b.hasAttribute('data-undo')) { if (toastUndo) { toastUndo(); } hideToast(); render(); return; }
});
main.addEventListener('input', e => {
  const f = e.target.dataset.field; if (!f || !ui.draft) return;
  const row = rowByEl(e.target); if (!row) return;
  ui.draft.dirty = true;
  if (f === 'name') {
    row.name = e.target.value;
    if (!row.catId) { row.icon = iconFor(row.name); e.target.closest('.brow').querySelector('.ci').textContent = row.icon; }
  } else { liveFormat(e.target); row.amount = parseAmount(e.target.value); updateTotal(); }
});
main.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const f = e.target.dataset.field; if (!f) return;
  e.preventDefault();
  const el = e.target.closest('.brow');
  if (f === 'name') { el.querySelector('[data-field=amount]').focus(); }
  else { const next = el.nextElementSibling; if (next) next.querySelector('[data-field=name]').focus(); else addRow(true); }
});
main.addEventListener('focusout', e => {
  if (e.target.dataset && e.target.dataset.field === 'amount') { const row = rowByEl(e.target); if (row) e.target.value = row.amount ? fmtInput(row.amount) : ''; }
});
sheetRoot.addEventListener('click', e => {
  if (e.target.classList.contains('backdrop')) { closeSheet(); return; }
  const b = e.target.closest('[data-close],[data-pick],[data-newcat],[data-newcat-add],[data-newcat-cancel],[data-repeat],[data-date],[data-save],[data-save-more],[data-delete],[data-reset]');
  if (!b) return;
  if (b.hasAttribute('data-close')) closeSheet();
  else if (b.dataset.pick) { es.catId = b.dataset.pick; refreshChips(); hint(''); }
  else if (b.hasAttribute('data-newcat')) showNewCat();
  else if (b.hasAttribute('data-newcat-add')) addNewCat();
  else if (b.hasAttribute('data-newcat-cancel')) refreshChips();
  else if (b.dataset.repeat) repeat(b.dataset.repeat);
  else if (b.dataset.date) { es.date = b.dataset.date; refreshDates(); }
  else if (b.hasAttribute('data-save')) saveExpense(false);
  else if (b.hasAttribute('data-save-more')) saveExpense(true);
  else if (b.hasAttribute('data-delete')) { const id = es.id; closeSheet(); deleteExpense(id); render(); }
  else if (b.hasAttribute('data-reset')) resetDemo(b);
});
sheetRoot.addEventListener('input', e => {
  if (!es) return;
  if (e.target.id === 'amt') { liveFormat(e.target); es.amount = parseAmount(e.target.value); if (es.amount > 0) hint(''); }
  else if (e.target.id === 'desc') { es.desc = e.target.value; suggestCat(e.target.value); }
  else if (e.target.id === 'nc-amt') { liveFormat(e.target); }
});
sheetRoot.addEventListener('change', e => {
  if (e.target.id === 'dpick' && e.target.value && es) { es.date = e.target.value; refreshDates(); }
  else if (e.target.name === 'cur') { state.settings.currency = e.target.value; save(); render(); }
});
sheetRoot.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.key !== 'Enter' || !es) return;
  const id = e.target.id;
  if (id === 'amt' || id === 'desc') { e.preventDefault(); saveExpense(false); }
  else if (id === 'nc-name') { e.preventDefault(); $('#nc-amt').focus(); }
  else if (id === 'nc-amt') { e.preventDefault(); addNewCat(); }
});

/* ---------- start ---------- */
const token = (location.hash || '').replace('#', '');
if (['home', 'budget', 'expenses'].includes(token)) ui.view = token;
render();
})();
</script>
</body>
</html>
